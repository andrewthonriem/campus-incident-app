name: campus_incident_app
description: Campus Incident Reporting App - report campus issues and track their resolution.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  image: ^4.12.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .campus pics/WhatsApp Image 2026-10-15 at 11.39.28 PM.jpeg
